<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@8.3.1/dist/apexcharts.min.js"></script>
    <!-- vue 쓰기 위해 얘넬 import 해야 함 -->
    <style>
        #chart {
        max-width: 650px;
        margin: 35px auto;
        }
        #chart .apexcharts-xaxis-label {
        font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->
        <div id="chart"></div>
    </div>
</body>
</html>

<script>
    const app = Vue.createApp({ // createApp함수는 인자로 맵을 받음
        data() {
            return {
                // 변수 - (key : value) <맵형태
                chart: null,
                list:[]

            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnTest: function () {
                let self = this;
                $.ajax({
                    url: "http://192.168.30.57:3000/student",
                    dataType: "json",
                    type: "GET",
                    data: {},
                    success: function (data) {
                        console.log(data);
                        self.list = data.list;
                        let nameList = [];
                        let heightList = [];
                        for(let i=0; i<data.list.length; i++){
                            nameList.push(data.list[i].STU_NAME) ;
                            heightList.push(data.list[i].STU_HEIGHT);
                        }
                        
                            var colors = [
                            '#008FFB',
                            '#00E396',
                            '#FEB019',
                            '#FF4560',
                            '#775DD0',
                            '#546E7A',
                            '#26a69a',
                            '#3F51B5',
                            ]

                            var options = {
                            series: [
                                {
                                name: 'Deals closed',
                                data: heightList
                                // data: [21, 22, 10, 28, 16, 21, 13, 30],
                                },
                            ],
                            chart: {
                                height: 350,
                                type: 'bar',
                                events: {
                                click: function (chart, w, e) {
                                    // console.log(chart, w, e)
                                },
                                },
                            },
                            colors: colors,
                            title: {
                                text: 'Deals Closed by Sales Rep',
                                align: 'left',
                            },
                            plotOptions: {
                                bar: {
                                columnWidth: '45%',
                                distributed: true,
                                },
                            },
                            dataLabels: {
                                enabled: false,
                            },
                            legend: {
                                show: false,
                            },
                            yaxis: {
                                title: {
                                text: 'Deals closed',
                                },
                            },
                            xaxis: {
                                categories: nameList,
                                // ['Joe', 'Smith'],
                                // ['Jake', 'Williams'],
                                // 'Amber',
                                // ['Peter', 'Brown'],
                                // ['Mary', 'Evans'],
                                // ['David', 'Wilson'],
                                // ['Lily', 'Roberts'],
                                // ],
                                labels: {
                                style: {
                                    colors: colors,
                                    fontSize: '12px',
                                },
                                },
                            },
                            }

                            self.chart = new ApexCharts(document.querySelector('#chart'), options);
                            self.chart.render();
                        }
                    
                })
            },
            
            
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
            let self=this;
            self.fnTest();
        }
    });

    app.mount('#app');
</script>
