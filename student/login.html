<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table, tr, td, th{
            border : 2px solid black;
            border-collapse: collapse;
            padding : 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->
        <div>
            <div>학번 : <input v-model="stuNo"></div>
            <div>이름 : <input v-model="stuName"></div>
            <div><button @click="fnLogin">로그인</button></div>
        </div>
    </div>
</body>
</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                stuNo : "",
                stuName : ""
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnLogin : function () {
                let self = this;
                $.ajax({
                    url: "http://localhost:3000/login",
                    dataType: "json",
                    type: "GET",
                    data: {stuNo : self.stuNo, stuName : self.stuName},
                    success: function (data) {
                        console.log(data);
                        if(data.info == undefined || data.info == null){
                            alert("정보를 다시 확인해주셈");
                        } else {
                            alert(self.stuName + "님 환영합니다!");
                            location.href = "student-list.html";
                        }
                    }
                });
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        }
    });

    app.mount('#app');
</script>
