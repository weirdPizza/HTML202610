<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="fnAlert()">alert버튼</button>
    <button onclick="fnConfrim()">confirm버튼</button>
    <button onclick="fnPrompt()">prompt버튼</button>
</body>
</html>
<script>
    // 변수
    // 자바처럼 변수 선언 시 정수, 실수, 불린 등을 구분 안해도 된다.
    // let, var에 다 담으면 되고
    // const는 상수

    let a = 30;
    let b = 30.5;
    let c = true;
    let d = "Hello";
    let e = [1,3,4,5,6];
    let f = {name : "홍길동", age : 30};
    let g = new Date();
    let h = function(){
        alert("안녕");
    }

    function fnAlert(){
        // alert => 알림창. '확인' 버튼 하나 밖에 없음
        alert("버튼을 눌렀어요!");
    };
    function fnConfrim(){
        // '확인', '취소' 버튼이 있음.
        // '확인' 누르면 true 리턴 '취소' 누르면 false 리턴
        let result = confirm("정말 삭제?");
        // if(result) {
        //     alert("삭제되었습니다!");
        // }
        // 위 코드와 동일함. 밑에 코드같이 많이들 작성함.
        if(confirm("정말 삭제?")) {
            alert("삭제되었습니다!");
        }
    };
    function fnPrompt(){
        // 잘 안씀. 참고로만 알아두어라.
        // 값을 입력받을 수 있는 창
        let name = prompt("이름을 입력하여라");
        alert(name+"님 환영합니다!");
    };

    // console.log("안녕"); // 자바의 프린트문
    let name = "홍길동";
    // js는 문자열 비교를 ==로도 함. 자바는 무조건 .equals()써야했던 것과 달리
    if(name == "홍길동") {
        console.log("참");
    }else {
        console.log("거짓");
    }

    let num ="10";
    if(num == 10) {
        console.log("2번 : 참"); // 참
    }else {
        console.log("2번 : 거짓");
    }
    if(num === 10) {
        console.log("3번 : 참");
    }else {
        console.log("3번 : 거짓"); // 거짓
    }
    // '='이 2개짜리는 타입 상관없이 값만 같다면 'true' 리턴
    // '='이 3개짜리는 값과 타입까지 같아야 'true'
    // 보통은 프로그램 안정성을 위해 3개짜리 많이 씀
</script>
