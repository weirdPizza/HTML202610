<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width : 200px;
            height: 200px;
            border : 2px solid black;
            text-align: center;
            line-height: 200px;
        }
        .box1 {
            background-color: tomato;
        }
        .box2 {
            background-color: orange;
            position: absolute;
            top : 30px;
            left : 50px;
        }
        .box3 {
            background-color: cornflowerblue;
            position: absolute;
            top : 100px;
            right : 50px;
        }
    </style>
</head>
<body>
    <!-- absolute는 부모 요소에 영향을 받아서 배치 -->
    <!-- 부모 요소(태그)중에 static이 아닌 요소를 기준으로 배치 -->
    <!-- 부모 요소 중에 static이 아닌 요소가 없을 경우 body 태그 기준으로 배치 -->
    <!-- 보통은 relative랑 조합해서 많이 사용된다. -->

    <div class="box1">box1</div>
    <div class="box2">box2</div>

    <div style="width: 800px; height: 500px; position: relative;">
        <div class="box3">box3</div>
    </div>
</body>
</html>
