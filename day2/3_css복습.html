<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            color : olivedrab;
        }
        #accent {
            font-weight : bold;            
        }
        .bg {
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <!-- id는 중복x, class 중복o -->
    <div id="accent" class="bg">텍스트 1</div>
    <div><span class="bg">텍스트 2</span></div>
    <div>텍스트 3</div>
</body>
</html>
