<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .list1 {
            list-style-type: square;
        }
        .list2 {
            list-style-image: url(../images/dot.png);
        }
        .list3 li{
            color : blue;
            display: inline-block;
            /* 기본값이 block인 display를 inline-block으로 바꿔주면 일자 정렬됨 */
        }
    </style>
</head>
<body>
    <ul class="list1">
        <li>자바</li>
        <li>오라클</li>
        <li>HTML</li>
    </ul>
    <hr>
    <ul class="list2">
        <li>자바</li>
        <li>오라클</li>
        <li>HTML</li>
    </ul>
    <hr>
    <ul class="list3">
        <li>자바</li>
        <li>오라클</li>
        <li>HTML</li>
    </ul>

</body>
</html>
