<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a {
            text-decoration: none;
        }
        /* hover -> 마우스를 올렸을 때 동작 */
        /* 꼭 a태그에서만 쓸 필요는 없습니다. */
        /* a:hover{
            background-color: black;
            color: white;
        } */

        /* link -> 방문하지 않은 링크에 스타일을 부여 */
        a:link{
            color : tomato;
        }

        /* visited -> 방문한 링크에 스타일을 부여 */
        a:visited{
            color : steelblue;
        }

        /* active -> 클릭하는 순간에 스타일 부여*/
        a:active{
            background-color: black;
            color: white;
        }

        /* focus -> 포커스가 잡히는 순간*/
        a:focus{
            background-color: cyan;
            color: yellow;
        }

    </style>
</head>
<body>
    <a href="https://www.naver.com">네이버</a>
    <a href="https://www.msn.com/ko-kr/weather/forecast/in-%EC%9D%B8%EC%B2%9C,%EB%B6%80%ED%8F%89?loc=eyJsIjoi67aA7Y%2BJIiwiciI6IuyduOyynCIsImMiOiLrjIDtlZzrr7zqta0iLCJpIjoiS1IiLCJnIjoia28ta3IiLCJ4IjoiMTI2LjczMDUxNDUyNjM2NzE5IiwieSI6IjM3LjQ4OTk3ODc5MDI4MzIifQ%3D%3D&weadegreetype=C&ocid=msedgntp&cvid=6ac5afc76913479b8aa62e8bbc96a63a&content=NormalWeather_wxnw">복습문제</a>
</body>
</html>
