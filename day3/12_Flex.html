<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            /* width: 1000px;  */
            /* 뭐냐 놓침.. 쌤꺼보고 수정해놓게... */
            border: 2px solid black;
            background-color: #eee;
            display: flex;
            justify-content: row;
        }
        .box {
            width: 100px;
            margin : 10px;
            background-color : orange;
            color : white;
            text-align : center;
        }

        .dir1 {
            /* 디폴트, 왼쪽에서 오른쪽으로 정렬 */
            flex-direction: row;
        }
        .dir2 {
            flex-direction: row-reverse;
        }
        .dir3 {
            flex-direction: column;
        }
        .dir4 {
            
            flex-direction: column-reverse;
        }

        .wrap1 {
            /* 디폴트, 한줄에 표시 */
            flex-wrap: nowrap;
        }
        .wrap2 {
            /* 여러줄에 표시 */
            flex-wrap: wrap;
        }
        .wrap3 {
            flex-wrap: wrap-reverse;
        }
    </style>
</head>
<body>
    <div id="container" class="wrap2">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</body>
</html>
