<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input태그!</title>
</head>
<body>
    <!-- 영역을 잡는 fieldset, 영역의 타이틀 legend -->
    <fieldset>
        <legend>회원가입</legend>
        <div>
            <!-- input 태그의 기본 type은 text (생략 가능) -->
            <label>아이디 : <input id="userId" type="text" autofocus placeholder="아이디를 입력해주세요."></label>
            <input type="button" value="중복체크">
        </div>
        <div>
            <label>비밀번호 : <input id="pwd1" type="password" placeholder="비밀번호를 입력해주세요."></label>
        </div>
        <div>
            <label>비밀번호 확인 : <input id="pwd2" type="password" placeholder="같은 비밀번호를 입력해주세요."></label>
        </div>
        <div>
            <!-- 골뱅이와 점 없으면 이메일 형식 아니라 알려줌. 근데 한계가 있어서 input email은 잘 안쓰긴 해. -->
            <!-- 나중에 정규식으로 대체하게 될 운명 -->
            <label>이메일 : <input id="email" type="email"></label>
            <!-- 나이를 입력할 때 input number 써도 돼? ㄴㄴ number는 소수점의 점 허용, 지수의 e 허용해서 안 씀. 정규식으로 대체함. -->
        </div>
        <div>
            <!-- name으로 묶어야 그룹 가능 -->
            성별 :
            <label><input type="radio" name="gender" value="M">남자</label>
            <label><input type="radio" name="gender" value="F">여자</label>
        </div>

        <div>
            자기소개 : 
            <div>
                <textarea id="intro" cols="50" rows="8" placeholder="자기소개를 입력하세요."></textarea>
            </div>
        </div>

        <div>
            <button onclick="fnJoin()">회원가입</button>
        </div>
    </fieldset>
</body>
</html>
