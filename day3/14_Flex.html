<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            /* width: 1000px; */
            border: 2px solid black;
            background-color: #eee;
            display: flex;
        }
        .box {
            width: 100px;
            margin : 10px;
            background-color : orange;
            color : white;
            text-align : center;
        }

        .order1 {
            /* 디폴트, 왼쪽에서 오른쪽으로 정렬 */
            justify-content: flex-start;
        }
        .order2 {
            justify-content: flex-end;
        }
        .order3 {
            /* 3~5 많이 씀 */
            /* 중앙을 기준으로 배치, 간격이 없다. */
            justify-content: center;
        }
        .order4 {
            /* 양쪽 끝에 배치한 후 나머지는 같은 간격으로 배치 */
            justify-content: space-between;
        }
        .order5 {
            /* 양쪽 끝에 약간의 여백을 준 후에 같은 간격으로 배치 */
            justify-content: space-around;
        }
        .order6 {
            /* 양쪽 끝을 포함해서 같은 간격으로 배치 */
            justify-content: space-evenly;
        }
        
    </style>
</head>
<body>
    <div id="container" class="order6">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</body>
</html>
