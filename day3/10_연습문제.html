<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 1150px;
            margin : 40px auto;
        }
        .box {
            background-color: beige;
            width: 550px;
            height: 250px;
            border: 3px solid black;
            float : left;
            box-sizing: border-box;
            position: relative;
            margin: 10px;
        }

        .box > .content, img{
            width: 50%;
            height : 100%;
            float: left;
        }
        
        .content{
            text-align: center;
            position: relative;
            top: 70px;
            
        }
        
        .content div:first-child {
            font-size: 24px;
            font-weight: bold;
            margin : 10px;
            
        }

        .content div:nth-child(2) {
            font-size: 16px;
            font-weight: bold;
            display: inline-block;
        }
        
        @media screen and (max-width : 1100px){ 
            .container {
                width: 600px;
                margin : 40px auto;
            }
            .box{
                clear: both;
               
            }
        }

        @media screen and (max-width : 500px){ 
            .container {
                width: 300px;
                margin : 40px auto;
            }
            .box {
                width: 250px;
                height: 550px;
            }
            .box > .content, img{
                width: 100%;
                height : 50%;
            }
            .content{
                top: 90px;
            
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <!-- <div class="img"></div> -->
            <img src="../images/lion.jpg" alt="">
            <div class="content">
                <div>아유... 하기 싫어</div>
                <div>- 거성 박명수 -</div>
            </div>
        </div>
        <div class="box">
            <img src="../images/bird.jpg" alt="">
            <div class="content">
                <div>그냥 놀고 싶다</div> 
                <div>- 거성 박명수 -</div>
            </div>
        </div>  
    </div>

    
    
</body>
</html>
