<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, tr, th, td{
            border : 2px solid black;
            padding : 10px 20px;
            text-align: center;
            border-collapse: collapse;
        }

        /* tr태그 중 첫번째 요소만 적용 */
        /* tr:nth-child(1) {
            color : blue;
        } */

        /* odd, 2n+1 : 홀수번째 */
        /* even, 2n : 짝수번째 */
        tr:nth-child(even) {
            background-color : #eee;
        }

        tr:first-child{
            background-color: black;
            color : white;
        }
    </style>
</head>
<body>

        <tr>
            <th>이름</th>
