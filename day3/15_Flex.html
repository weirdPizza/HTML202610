<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            /* width: 1000px; */
            height: 300px;
            border: 2px solid black;
            background-color: #eee;
            display: flex;
        }
        .box {
            width: 100px;
            margin : 10px;
            background-color : orange;
            color : white;
            text-align : center;
        }

        .order1 {
            align-items: flex-start;
        }
        .order2 {
            align-items: flex-end;
        }
        .order3 {
            align-items: center;
        }
        
    </style>
</head>
<body>
    <div id="container" class="order2">
        <div class="box">1</div>
        <div class="box" style="font-size: 30px;">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</body>
</html>
