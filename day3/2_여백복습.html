<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
            width: 150px;
            height: 150px;
            text-align: center;
            line-height: 86px;
            /* line-height는 실제 요소의 크기를 기준으로 함. 그래서 border-box인 경우 주의 */
            border : 2px solid black;
            background-color: mediumpurple;

            /* margin-bottom: 10px; */
            /* margin : 10px 0; */
            margin : 10px;

            padding : 30px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box1">box1</div>
    <div class="box1">box2</div>
</body>
</html>
