<body>
    <div class="subject">자바</div>

    <div class="subject">html</div>

<script>
    function fnTest(){
        let obj = document.querySelectorAll(".subject");
        // console.log(obj);
        for(let i=0; i<obj.length; i++){
            // if(i%2==0){
            //     obj[i].style.color = "red";
            // }else{
            //     obj[i].style.color = "blue";
            // }
            let r = Math.floor(Math.random() * 256);
            let g = Math.floor(Math.random() * 256);
            let b = Math.floor(Math.random() * 256);
            obj[i].style.color=`rgb(${r},${g},${b})`;
            
        }

    }
</script>
