<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid 실습 완성본</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #f0f2f5;
      color: #333;
    }

    .box {
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px #eee;
      font-weight: bold;
      font-size: 20px;
    }
    #container {
      display: grid;
      gap: 20px;    
      grid-template-columns: 250px 1fr; 
      grid-template-rows: 150px minmax(500px, auto) 150px;
      grid-template-areas:
        "header header"
        "side contents" 
        "footer footer";
    }
    #header {
      background-color: #ff6b6b;
      color: white;
      grid-area: header; 
    }
    #side {
      background-color: #4ecdc4;
      color: white;
      grid-area: side;
    }
    #contents {
      background-color: #ccc;
      box-shadow: none;
      padding: 20px;
      grid-area: contents;
    }
    #footer {
      background-color: #45b7d1;
      color: white;
      grid-area: footer;
    }
    
    #contents{
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
      grid-auto-rows: 150px;
      gap: 20px;
    }
    .widget {
      background-color: white;
      border-radius: 8px;
      padding: 16px;
    }
    .word {
      font-size: 16px;
      margin-top: 10px;
    }

    /* 크기 작아졌을 때 처리 */
    @media (max-width: 768px) {
      #container {
        grid-template-rows: 150px 150px minmax(500px, auto) 150px;
        grid-template-columns: 1fr; 

        grid-template-areas:
        "header"
        "side"
        "contents"
        "footer";
      }
      #contents{
        grid-template-columns: 1fr;

      }
    }
  </style>
</head>

<body>

  <div id="container">
    <div class="box" id="header">헤더 영역~~</div>
    <div class="box" id="side">사이드영역~~</div>
    <div class="box" id="contents">
      <div class="widget">
        위젯 1<div class="word">방문자 수: 1,234명</div>
      </div>
      <div class="widget">위젯 2
        <div class="word">매출: 5,123,120원</div>
      </div>
      <div class="widget">
        위젯 3<div class="word">신규 가입: 42명</div>
      </div>
      <div class="widget">
        위젯 4<div class="word">서버 상태: 양호</div>
      </div>
      <div class="widget">
        위젯 5<div class="word">최근 알림이 없습니다.</div>
      </div>
    </div>
    <div class="box" id="footer">하단 영역~~</div>
  </div>
</body>
</html>
