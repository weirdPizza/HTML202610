<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .txt {
            color : dodgerblue;
            font-size: 30px;
            font-weight: 600;
            font-style: italic;
            text-decoration: line-through;
            text-align: center;
            /* span 태그는 자기 영역만 있으니까 여유 공간이 없으니 가운데 정렬 못함 */
            /* div는 한 줄 다 차지하니까 그 한 줄 안에서 가운데 정렬이 가능한거임 */
        }
        .shadow {
            text-shadow: 2px 2px 0px rgb(255, 56, 252);
        }
    </style>
</head>
<body>
    <div class="txt shadow">
        HTML 재밌다~!~!~!!~~~!~!
    </div>
</body>
</html>
