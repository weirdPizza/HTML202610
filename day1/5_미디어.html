<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- img : 이미지 출력 태그 -->
    <!-- video : 영상 출력 태그 -->

    <!-- width, height 속성 : 너비, 높이 조절 -->

        <img src="../images/lion.jpg" alt="사자" width="200" height="100">
    </a>
    <br>
    <!-- 요즘 추세는 video 태그를 쓰지 않음 -->
    <video src="../images/flower.mp4" controls loop muted></video>
    

</body>
</html>
