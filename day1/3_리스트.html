<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리스트</title>
</head>
<body>
    <!-- 목록화 할 때 사용하는 태그 (ol, ul) -->

    <!-- ul 태그는 순서가 없는 목록 작성할 때  -->
    <ul>
        <li>자바</li>
        <li>오라클</li>
        <li>HTML</li>
    </ul>
    <hr>
    <!-- ol 태그는 순서가 있는 목록 작성할 때  -->
     <!-- type 속성에 따라 표기법이 달라짐. 디폴트는 숫자(1) -->
    <ol type="i" reversed>
        <li>자바</li>
        <li>오라클</li>
        <li>HTML</li>
    </ol>

</body>
</html>
