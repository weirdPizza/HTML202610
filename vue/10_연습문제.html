<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- vue 쓰기 위해 얘넬 import 해야 함 -->
</head>
<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->
        <div>
            <label><input type="checkbox" name="subject" v-model="subject" value="java">java</label>
            <label><input type="checkbox" name="subject" v-model="subject" value="oracle">oracle</label>
            <label><input type="checkbox" name="subject" v-model="subject" value="html">html</label>
            <label><input type="checkbox" name="subject" v-model="subject" value="jquery">jquery</label>
            <button @click="fnTest">클릭!</button>
            <hr>
            <span v-for="item in imgList">
                <img :src="item" alt="">
                <!-- :넣으면 item을 변수취급 중요! -->
            </span>
        </div>
        <hr>

    </div>
</body>
</html>
<!-- 리스트에 있는 요소들 개수만큼 img 만들어짐
 [첨자]로 java 있으면 자바 사진 출력 -->
<script>
    const app = Vue.createApp({ // createApp함수는 인자로 맵을 받음
        data() {
            return {
                // 변수 - (key : value) <맵형태
                subject: [],
                imgList: []
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnTest: function () {
                let self = this;
                self.imgList=[];
                for(let i=0; i<self.subject.length; i++) {
                    let path=`../images/${self.subject[i]}.jpg`;
                    self.imgList.push(path);
                }
                console.log(self.imgList)
                
            }

        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        }
    });

    app.mount('#app');
</script>
