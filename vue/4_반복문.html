<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- vue 쓰기 위해 얘넬 import 해야 함 -->
     <style>
        table,tr,td,th{
            border: 2px solid black;
            border-collapse: collapse;
            padding: 10px;
            text-align: center;
        }
     </style>
</head>
<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->
        <div v-for="item in numList">
            <span v-if="item>=3" style="color: blue;">{{item}}</span>
            <span v-else>{{item}}</span>
        </div>
        <hr>

        <div v-for="(item,index) in strList">
            {{index+1}}. {{item}}
        </div>
        <hr>

        <span v-for="item in num">
            {{item}} 
        </span>
        <hr>

        <table>
            <tr>
                <th>No.</th>
                <th>이름</th>
                <th>주소</th>
            </tr>
            <tr v-for="(item, index) in jsonData">
                <td>{{index+1}}</td>
                <td>{{item.name}}</td>
                <td>{{item.addr}}</td>
            </tr>
        </table>
    </div>
</body>
</html>

<script>
    const app = Vue.createApp({ // createApp함수는 인자로 맵을 받음
        data() {
            return {
                // 변수 - (key : value) <맵형태
                num : 10,
                numList : [3,5,2,4,1],
                strList : ["java","oracle","html"],
                jsonData : [
                    {name : "밥", addr:"인천"},
                    {name : "앤", addr:"서울"},
                    {name : "제니", addr:"제주도"}
                ]
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnTest: function () {
                let self = this;
                $.ajax({
                    url: "",
                    dataType: "json",
                    type: "GET",
                    data: {},
                    success: function (data) {

                    }
                });
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        }
    });

    app.mount('#app');
</script>
