<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- vue 쓰기 위해 얘넬 import 해야 함 -->
    <style>
        table,tr,td,th{
            border: 1px solid black;
            border-collapse: collapse;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->
        <div>
            <div>
                검색어: <input type="text" v-model="keyword" @keyup.enter="fnTest(keyword)">
                <!-- input 안에 @keyup.enter="" 엔터누르면 취할 메소드?지정 -->
                <button @click="fnTest">검색</button>
            </div>
            <div>
                <select v-model="grade" @change="fnTest(grade)">
                    <option>::전체::</option>
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3">3학년</option>

                </select>
            </div>
            <table>
                <tr>
                    <th>학번</th>
                    <th>이름</th>
                    <th>학과</th>
                    <th>학년</th>
                </tr>
                <tr v-for="item in list">
                    <td>{{item.STU_NO}}</td>
                    <td>{{item.STU_NAME}}</td>
                    <td>{{item.STU_DEPT}}</td>
                    <td>{{item.STU_GRADE}}</td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>

<script>
    const app = Vue.createApp({ // createApp함수는 인자로 맵을 받음
        data() {
            return {
                // 변수 - (key : value) <맵형태
                list : [],
                keyword : "",
                grade:""
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnTest: function () {
                let self = this;
                $.ajax({
                    url: "http://192.168.30.57:3000/student",
                    dataType: "json",
                    type: "GET",
                    data: {keyword : self.keyword, grade: self.grade}, // 서버로 보낼 값
                    // keyword란 단어 말고 qqq : self.keyword로 보내면 안돼? 안됨. 왜? 서버장이 keyword로 받겠다고 선언해놓음.
                    success: function (data) {
                        console.log(data);
                        self.list = data.list;
                        // self.list 의 list는 내가 지정한 변수 이름
                        // data.list는 서버장이 만든 data 변수 이름
                    }
                });
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
            let self = this;
            self.fnTest();
        }
    });

    app.mount('#app');
</script>
