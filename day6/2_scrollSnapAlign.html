<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Scroll Snap: Align 차이 확인하기</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #222;
    }

    .snap-container {
      width: 100vw;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory; 
    }

    .snap-section {
      width: 80vw;
      height: 40vh; 
      margin: 10vh auto; 
      border-radius: 20px;
      
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      color: white;
      
      /* 
        - start: 박스가 화면 '맨 위'에 붙어서 멈춤.
        - center: 박스가 화면 '정중앙'에 위치하며 멈춤.
        - end: 박스가 화면 '맨 아래'에 붙어서 멈춤.
      */
      scroll-snap-align: center; 
    }

    .bg-1 { background-color: #ff7675; }
    .bg-2 { background-color: #74b9ff; }
    .bg-3 { background-color: #55efc4; }
    .bg-4 { background-color: #a29bfe; }
    .bg-5 { background-color: #ffeaa7; color: #333; }
  </style>
</head>
<body>

  <div class="snap-container">
    <div class="snap-section bg-1">박스 1</div>
    <div class="snap-section bg-2">박스 2</div>
    <div class="snap-section bg-3">박스 3</div>
    <div class="snap-section bg-4">박스 4</div>
    <div class="snap-section bg-5">박스 5</div>
  </div>

</body>
</html>
