<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Scroll Snap: Vertical</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    .snap-container {
      width: 100vw;
      height: 100vh; /* 화면 전체 높이 */
      overflow-y: scroll; /* 세로 스크롤 활성화 */
      
      /* 
        mandatory : 스크롤이 멈추면 중간에 멈추는 거 없음. 무조건 가까운 요소로 이동.
        proximity : 애매하게 걸칠 경우 그냥 멈춤.
      */
      scroll-snap-type: y mandatory ;

    }

    .snap-section {
      width: 100vw;
      height: 100vh; 
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      color: white;
      
      scroll-snap-align: center;

      /* 
        always : 한번에 여러 섹션을 넘어가는 것을 어느정도 방지.
        normal : 기본값. 휠을 세게 굴리면 여러 섹션 바로 지나감.
      */
      scroll-snap-stop: always;
    }

    /* 시각적 구분을 위한 배경색 */
    .bg-1 { background-color: #ff7675; }
    .bg-2 { background-color: #74b9ff; }
    .bg-3 { background-color: #55efc4; }
    .bg-4 { background-color: #a29bfe; }
  </style>
</head>
<body>

  <div class="snap-container">
    <div class="snap-section bg-1">영상 1</div>
    <div class="snap-section bg-2">영상 2</div>
    <div class="snap-section bg-3">영상 3</div>
    <div class="snap-section bg-4">영상 4</div>
  </div>

</body>
</html>
