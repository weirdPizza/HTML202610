<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CSS Transform 연습문제</title>
  <style>
    
    body {
      background-color: #eef2f5;
      padding: 40px;
      display: flex;
      gap: 50px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .quiz-box {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      width: 280px;
      text-align: center;
    }
    h3 { margin-top: 0; color: #2c3e50; }
    p.hint { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 25px; }
    
    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #ff4757;
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      transition: transform 0.3s ease;
    }

    .center-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      background-color: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

   
    .door-frame {
      width: 160px;
      height: 220px;
      margin: 0 auto;
      background-color: #f1c40f;
      border: 6px solid #34495e;
      border-radius: 8px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #333;
      /* 3D 원근감 부여  */
      perspective: 500px;
    }
    .door {
      width: 100%;
      height: 100%;
      background-color: #2ecc71;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.6s ease;
      border-right: 4px solid #27ae60;
    }

    /* 아래 두개 채워서 완성시키기 */
    .door {
        perspective: 300;
        transform-origin: left;
    }
    .door-frame:hover .door {
        transform: rotateX(-100deg);
    }
  </style>
</head>
<body>

  <div class="quiz-box">
    <h3>3D 문 열기</h3>
    <p class="hint">초록색 문에 마우스를 올렸을 때<br>왼쪽 경첩을 기준으로 열리게 하세요.</p>
    
    <div class="door-frame">
      성공!
      <div class="door">문 열기</div>
    </div>
  </div>

</body>
</html>
