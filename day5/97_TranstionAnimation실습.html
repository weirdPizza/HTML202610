<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Transform + Transition + Animation 종합 실습</title>
  <style>
    /* 기본 레이아웃 (수정하지 마세요) */
    body {
      font-family: 'Malgun Gothic', sans-serif;
      background-color: #f0f3f7;
      padding: 40px;
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .quiz-card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      width: 280px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h3 { margin-top: 0; color: #2c3e50; font-size: 1.15rem; }
    p.desc { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 30px; line-height: 1.4; }
    .stage {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
    }

    /* 미션 1 기본 스타일 */
    .bell-wrapper {
      width: 70px;
      height: 70px;
      background-color: #fff3cd;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .bell {
      font-size: 2.5rem;
      cursor: pointer;
      display: inline-block; /* transform 적용을 위해 inline-block 필수 */
    }
    .dot {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 12px;
      height: 12px;
      background-color: #ff4757;
      border-radius: 50%;
      border: 2px solid white;
    }

    /* 미션 2 기본 스타일 */
    .tooltip-container {
      position: relative;
      cursor: pointer;
    }
    .hover-target {
      background-color: #34495e;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
    }
    .tooltip {
      position: absolute;
      bottom: 125%; /* 타겟 요소 위쪽에 배치 */
      left: 50%;
      background-color: #2ecc71;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none; /* 마우스 간섭 방지 */
      /* 초기 상태: 투명하고 살짝 아래(10px)에 내려가 있음 */
      opacity: 0;
      transform: translate(-50%, 10px);
    }

    /* 미션 3 기본 스타일 */
    .send-btn {
      width: 130px;
      height: 50px;
      background-color: #3498db;
      color: white;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: bold;
      cursor: pointer;
      overflow: hidden;
    }
    .plane {
      display: inline-block;
      font-size: 1.2rem;
    }


    /* 
       1) @keyframes ring : from(또는 0%)일 때 -15도 회전, to(또는 100%)일 때 15도 회전
       2) .bell : 기준점을 위쪽 중앙(top center)으로 설정하고,
                  ring 애니메이션을 0.4초, ease-in-out, 무한반복(infinite), 왕복(alternate)으로 실행
       3) .bell:hover : 마우스를 올리면 애니메이션 일시정지(paused) */
    
    @keyframes ring {
      /* 1-1. 키프레임 작성 */
      0%{
        transform: rotate(-15deg);
      }
      100%{
        transform: rotate(15deg);
      }
    }

    .bell {
      /* 1-2. 기준점(transform-origin)과 단축 animation 속성 작성 */
      transform-origin: top center;
      animation: ring 0.4s ease-in-out infinite alternate;
    }

    .bell:hover {
      /* 1-3. 애니메이션 일시정지 작성 */
      animation-play-state: paused;
    }


    /* 
       1) .tooltip : opacity와 transform 속성이 0.3초 동안 ease-out으로 변하도록 transition 설정
       2) .tooltip-container:hover .tooltip : 마우스를 올리면 투명도(opacity)를 1로 만들고,
          가로 중앙(-50%)은 유지한 채 세로 위치만 원래 자리(0px)로 이동 */
    
    .tooltip {
      /* 2-1. transition 작성 */
      transition: opacity 0.4s ease-out, transform 0.4s ease-out;
    }
    .tooltip-container:hover .tooltip {
      /* 2-2. opacity와 transform 작성 */
      transform: translate(-50%, 0px);
      opacity: 1;
  
    }


    /* 
       1) .send-btn : width와 background-color가 0.4초(ease) 동안 변하도록 transition 설정
       2) .plane : transform 속성이 0.4초(ease) 동안 변하되, '0.2초의 딜레이(대기시간)'를 갖도록 설정
       3) 마우스를 올렸을 때(:hover) 버튼 너비는 170px, 배경색은 #8e44ad로 바뀌고,
          비행기(.plane)는 오른쪽으로 25px, 위로 -25px 이동하면서 1.2배 커지게 작성 */
    
    .send-btn {
      /* 3-1. 버튼의 transition 작성 */
      transition: width 0.4s ease, background-color 0.4s ease;
    }
    .plane {
      /* 3-2. 비행기의 transition (0.2s 딜레이 포함!) 작성 */
      transition: transform 0.4s 0.2s;
    }

    .send-btn:hover {
      /* 3-3. 버튼 너비(170px)와 배경색(#8e44ad) 변경 작성 */
      width: 170px;
      background-color: #8e44ad;

    }
    .send-btn:hover .plane {
      /* 3-4. 비행기 이동(우측 25px, 위 -25px) 및 확대(1.2배) 작성 */
      transform: translate(25px, -25px) scale(1.2);
    }

  </style>
</head>
<body>

  <!-- 미션 1 -->
  <div class="quiz-card">
    <h3>미션 1. 흔들리는 알림 종</h3>
    <p class="desc">종이 매달린 꼭지점 기준으로 계속 흔들리고, 마우스를 올리면 멈추게 하세요.</p>
    <div class="stage">
      <div class="bell-wrapper">
        <span class="bell">🔔</span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- 미션 2 -->
  <div class="quiz-card">
    <h3>미션 2. 스르륵 툴팁</h3>
    <p class="desc">버튼에 마우스를 올리면 아래에서 위로 부드럽게 떠오르는 말풍선을 완성하세요.</p>
    <div class="stage">
      <div class="tooltip-container">
        <div class="tooltip">🎁 깜짝 쿠폰이 도착했어요!</div>
        <div class="hover-target">마우스를 올려보세요</div>
      </div>
    </div>
  </div>

  <!-- 미션 3 -->
  <div class="quiz-card">
    <h3>미션 3. 시간차 전송 버튼</h3>
    <p class="desc">버튼이 넓어지기 시작한 뒤, 0.2초 뒤에 비행기가 대각선 위로 날아가게 하세요.</p>
    <div class="stage">
      <div class="send-btn">
        <span>전송하기</span>
        <span class="plane">✈️</span>
      </div>
    </div>
  </div>
</body>
</html>
