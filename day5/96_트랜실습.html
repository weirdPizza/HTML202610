<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 500px;
            height: 700px;
            background-image: url("../images/poket1.png");
            background-size: cover;
            margin: 50px;
        }
        .box:hover {
            transition: background-image 0.5s 1s ease, transform 3s ease;
            transform: scale(-1, 1) rotateY(180deg);
            background-image: url("../images/poket2.png");

        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
